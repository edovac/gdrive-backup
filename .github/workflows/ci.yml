name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests and HexagonalArchitectureTest. The *IT tests are skipped
      # because their opt-in system properties are not set; they need real
      # Google accounts and credentials.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    # Not a required check: the ubuntu-latest job above is the real test/verify
    # gate. This just watches for regressions in the Windows jpackage app-image
    # build, so a failure here should never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Self-contained app-image: a native .exe launcher plus a bundled, trimmed
      # JRE. No installer, so no WiX/Inno Setup dependency to install on the runner.
      - name: Build self-contained app-image
        run: ./mvnw.cmd -B -P windows-package -DskipTests package

      - name: Upload app-image
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-image
          path: target/app-image/Google Drive Backup
